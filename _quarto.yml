format:
  html:
    lang: en
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme-dark.scss]
    mainfont: "Segoe UI, Helvetica, Arial, sans-serif, Atkinson Hyperlegible"
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    number-sections: true
    toc-expand: 2
    number-depth: 3

  pdf:
    engine: xelatex
    latex-auto-install: false

    documentclass: book
    classoption: ["oneside"]

    number-sections: true
    toc: true
    toc-depth: 3
    number-depth: 3
    toc-title: "List of Contents"
    lof: true
    lot: true
    lof-title: "List of Figures"
    lot-title: "List of Tables"

    geometry:
      - a4paper
      - top=2.5cm
      - left=3cm
      - right=2.5cm
      - bottom=2.5cm

    include-in-header:
      text: |
        % ── Font ─────────────────────────────────────────────────────────
        \usepackage{fontspec}


        % ── Language ─────────────────────────────────────────────────────
        \usepackage[english]{babel}
        \AtBeginDocument{\selectlanguage{english}}{\let\maketitle\relax}
        \addto\captionsenglish{
          \renewcommand{\contentsname}{List of Contents}
          \renewcommand{\listfigurename}{List of Figures}
          \renewcommand{\listtablename}{List of Tables}
          \renewcommand{\chaptername}{Chapter}
          \renewcommand{\appendixname}{Appendix}
        }

        % ── Additional packages ──────────────────────────────────────────
        \usepackage[table]{xcolor}
        \usepackage{colortbl}
        \usepackage{pdflscape}
        \usepackage{longtable}
        \usepackage{booktabs}
        \usepackage{amssymb}
        \usepackage{enumitem}
        \usepackage{caption}
        \setlist[enumerate]{nosep, leftmargin=*}
        \usepackage{tabularx}
        \usepackage{array}
        \usepackage{pdfpages}

        % ── Counter ──────────────────────────────────────────────────────
        \setcounter{secnumdepth}{3}
        \setcounter{tocdepth}{3}

        % ── Numbering ────────────────────────────────────────────────────
        \renewcommand{\thefigure}{\arabic{chapter}.\arabic{figure}}
        \renewcommand{\thetable}{\arabic{chapter}.\arabic{table}}
        \renewcommand{\thesection}{\arabic{chapter}.\arabic{section}}
        \renewcommand{\thesubsection}{\arabic{chapter}.\arabic{section}.\arabic{subsection}}
        \renewcommand{\thesubsubsection}{\arabic{chapter}.\arabic{section}.\arabic{subsection}.\arabic{subsubsection}}

        % ── Chapter / section title formatting ───────────────────────────
        \usepackage{titlesec}
        \usepackage{fancyhdr}
        \pagestyle{plain}

        \usepackage{titlesec}

        \titleformat{\chapter}
          {\normalfont\bfseries\centering\fontsize{12}{16}\selectfont}
          {CHAPTER \Roman{chapter}}{1em}{\MakeUppercase}
        \titlespacing*{\chapter}{0pt}{-10pt}{20pt}

        \titleformat{\section}
          {\normalfont\bfseries\normalsize}
          {\thesection}{1em}{}
        \titlespacing{\section}{0pt}{24pt plus 4pt minus 2pt}{6pt plus 2pt minus 2pt}

        \titleformat{\subsection}
          {\normalfont\bfseries\normalsize}
          {\thesubsection}{1em}{}
        \titlespacing{\subsection}{0pt}{18pt plus 4pt minus 2pt}{4pt plus 2pt minus 2pt}

        \titleformat{\subsubsection}
          {\normalfont\bfseries\normalsize}
          {\thesubsubsection}{1em}{}
        \titlespacing\subsubsection{0pt}{12pt plus 4pt minus 2pt}{2pt plus 2pt minus 2pt}

        % ── Appendix ─────────────────────────────────────────────────────
        \let\oldappendix\appendix
        \renewcommand{\appendix}{
          \oldappendix
          \renewcommand{\thechapter}{\arabic{chapter}}
          \setcounter{chapter}{0}
          \titleformat{\chapter}
            {\normalfont\bfseries\centering\fontsize{12}{16}\selectfont}
            {Appendix \thechapter}{1em}{\MakeUppercase}
          \renewcommand{\thetable}{\thechapter.\arabic{table}}
          \renewcommand{\thefigure}{\thechapter.\arabic{figure}}
          \setcounter{table}{0}
          \setcounter{figure}{0}
          \captionsetup[figure]{list=no}
          \captionsetup[table]{list=no}
        }

        % ── Spacing ──────────────────────────────────────────────────────
        \usepackage{setspace}
        \linespread{1.15}
        \setlength{\parindent}{0.95cm}
        \setlength{\parskip}{6pt}

        % ── Landscape page number ────────────────────────────────────────
        \usepackage{everypage}
        \AddEverypageHook{%
          \ifdim\textwidth>\textheight
            \fancyhf{}
            \fancyfoot[C]{\thepage}
          \fi
        }

        % ── Hyphenation ──────────────────────────────────────────────────
        \usepackage[none]{hyphenat}
        \sloppy

        \AfterEndPreamble{
          \renewcommand{\listfigurename}{List of Figures}
          \renewcommand{\listtablename}{List of Tables}
          \renewcommand{\contentsname}{List of Contents}
          \renewcommand{\appendixname}{Appendix}
        }
    include-before-body:
      - text: |
          \pagenumbering{gobble}
          \newpage
          \pagenumbering{arabic}
          \setcounter{page}{1}

freeze: auto
editor: visual